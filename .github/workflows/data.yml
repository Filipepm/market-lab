name: Market data

on:
  schedule:
    # GitHub starts scheduled runs late (4-5 hours late so far), so the 3-4 PM New York option
    # snapshot window was always missed. Try every 20 minutes from 14:07 to 20:47 UTC on weekdays:
    # whichever run lands inside the window takes the snapshot (fetch_data.py only takes one per day;
    # the other runs just refresh prices). Off-minute times are delayed less than :00/:30.
    - cron: "7,27,47 14-20 * * 1-5"
    # After the close: refresh daily prices.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency: market-data

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python lab/fetch_data.py
      - name: Save data
        run: |
          git config user.name "market-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F_%H%M)" && git pull --rebase && git push)
